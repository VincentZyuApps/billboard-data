name: Crawl Weekly Ranking

on:
  schedule:
    # 北京时间 每周三 18:05 触发 (UTC 10:05)
    - cron: '5 10 * * 3'
    # 北京时间 每周三 18:35 兜底重试 (UTC 10:35)
    - cron: '35 10 * * 3'
  workflow_dispatch: # 支持手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Run crawler
        run: |
          uv run scripts/crawler.py --incremental

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes detected. Nothing to commit."
          else
            LATEST=$(node -e "try { const d = require('./data/index.json'); console.log(d.latest_issue || ''); } catch(e) { console.log(''); }")
            git commit -m "chore(data): auto update weekly rankings [issue #$LATEST]"
            git push
          fi
